name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24']
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # لا تبعيات: لا خطوة تثبيت، الاختبارات تعمل مباشرة
      - name: Run tests
        run: node --test test/
      - name: Smoke-test the example
        run: node examples/node.mjs > /dev/null
